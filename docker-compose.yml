version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduos-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - SUPABASE_URL=https://opfmpmymtpbqeriwjmts.supabase.co
      - DB_HOST=db.opfmpmymtpbqeriwjmts.supabase.co
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=ReWamp@2026
      - DB_NAME=postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduos-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=https://opfmpmymtpbqeriwjmts.supabase.co
      - NEXT_PUBLIC_API_BASE=http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
